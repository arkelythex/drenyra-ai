<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0%" stop-color="#3CE6D8"/><stop offset="100%" stop-color="#9B7FE8"/>
 </linearGradient>
</defs>
<rect width="1400" height="460" fill="#000000"/>
<text x="82" y="80" fill="#EDEFF2" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Deterministic control plane</text>
<text x="82" y="116" fill="#A8B0BC" font-family="Inter,Arial,sans-serif" font-size="16">agents propose; the core validates; professionals decide; evidence remains</text>

<!-- left: agent hosts -->
<g transform="translate(92 166)">
 <rect width="220" height="210" rx="20" fill="#0A0A0A" stroke="#2A2A2A"/>
 <text x="24" y="36" fill="#A8B0BC" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2">AGENT HOSTS</text>
 <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#EDEFF2">
  <text x="24" y="86">Codex</text><text x="24" y="126">Claude</text><text x="24" y="166">OpenCode</text>
 </g>
</g>

<!-- core -->
<g transform="translate(410 150)">
 <rect width="560" height="240" rx="24" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <text x="28" y="38" fill="#EDEFF2" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">DRENYRA AI CORE</text>
 <text x="28" y="66" fill="#6B7480" font-family="Inter,Arial,sans-serif" font-size="12">transport-agnostic · versioned · fail-closed</text>

 <g transform="translate(28 96)">
   <rect width="146" height="58" rx="12" fill="#121212" stroke="#2A2A2A"/>
   <text x="73" y="25" text-anchor="middle" fill="#3CE6D8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">MISSIONS</text>
   <text x="73" y="44" text-anchor="middle" fill="#6B7480" font-family="Inter,Arial,sans-serif" font-size="10">15 canonical states</text>
 </g>
 <g transform="translate(191 96)">
   <rect width="146" height="58" rx="12" fill="#121212" stroke="#2A2A2A"/>
   <text x="73" y="25" text-anchor="middle" fill="#9B7FE8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">GATES</text>
   <text x="73" y="44" text-anchor="middle" fill="#6B7480" font-family="Inter,Arial,sans-serif" font-size="10">scope · authority</text>
 </g>
 <g transform="translate(354 96)">
   <rect width="146" height="58" rx="12" fill="#121212" stroke="#2A2A2A"/>
   <text x="73" y="25" text-anchor="middle" fill="#3CE6D8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">RECEIPTS</text>
   <text x="73" y="44" text-anchor="middle" fill="#6B7480" font-family="Inter,Arial,sans-serif" font-size="10">signed evidence</text>
 </g>
 <g transform="translate(110 170)">
   <rect width="340" height="42" rx="21" fill="#121212" stroke="url(#edge)" stroke-width="1.3"/>
   <text x="170" y="26" text-anchor="middle" fill="#EDEFF2" font-family="Inter,Arial,sans-serif" font-size="12">candidate → review tier → approval → immutable receipt</text>
 </g>
</g>

<!-- right: authority boundary -->
<g transform="translate(1068 166)">
 <rect width="240" height="210" rx="20" fill="#0A0A0A" stroke="#2A2A2A"/>
 <text x="24" y="36" fill="#A8B0BC" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2">AUTHORITY</text>
 <text x="24" y="84" fill="#EDEFF2" font-family="Inter,Arial,sans-serif" font-size="17">Professional</text>
 <text x="24" y="116" fill="#A8B0BC" font-family="Inter,Arial,sans-serif" font-size="12">explicit approval</text>
 <path d="M24 142 H216" stroke="#1A1A1A"/>
 <text x="24" y="174" fill="#EDEFF2" font-family="Inter,Arial,sans-serif" font-size="17">ERP / SUNAT</text>
 <text x="24" y="198" fill="#A8B0BC" font-family="Inter,Arial,sans-serif" font-size="12">external systems</text>
</g>

<!-- connectors -->
<path d="M312 271 H410" stroke="#3CE6D8" stroke-width="2"/>
<path d="M970 271 H1068" stroke="#9B7FE8" stroke-width="2"/>
<circle cx="361" cy="271" r="4" fill="#3CE6D8"/>
<circle cx="1019" cy="271" r="4" fill="#9B7FE8"/>
</svg>