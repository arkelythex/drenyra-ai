<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<rect width="1400" height="460" fill="#f3eadc"/>
<text x="64" y="50" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.0">VERIFICATION LIFECYCLE</text>
<text x="64" y="96" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Review without authorship</text>
<text x="64" y="128" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Freeze the target. Snapshot scope. Judge independently. Refute with evidence.</text>

<line x1="94" y1="246" x2="1304" y2="246" stroke="#3e2f20" stroke-width="1.6"/>
<g transform="translate(100 246)">
      <circle r="19" fill="#fff7ea" stroke="#0d4a68" stroke-width="2.3"/><circle r="5" fill="#0d4a68"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">FREEZE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">exact bytes</text>
    </g><g transform="translate(285 246)">
      <circle r="19" fill="#fff7ea" stroke="#824f16" stroke-width="2.3"/><circle r="5" fill="#824f16"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">SCOPE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">snapshot once</text>
    </g><g transform="translate(470 246)">
      <circle r="19" fill="#fff7ea" stroke="#57478b" stroke-width="2.3"/><circle r="5" fill="#57478b"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">JUDGE A + B</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">blind + parallel</text>
    </g><g transform="translate(665 246)">
      <circle r="19" fill="#fff7ea" stroke="#a7471c" stroke-width="2.3"/><circle r="5" fill="#a7471c"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">CANONICALIZE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">findings set</text>
    </g><g transform="translate(860 246)">
      <circle r="19" fill="#fff7ea" stroke="#0d4a68" stroke-width="2.3"/><circle r="5" fill="#0d4a68"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">REFUTE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">evidence check</text>
    </g><g transform="translate(1055 246)">
      <circle r="19" fill="#fff7ea" stroke="#654300" stroke-width="2.3"/><circle r="5" fill="#654300"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">CORRECT</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">≤ 2 rounds</text>
    </g><g transform="translate(1245 246)">
      <circle r="19" fill="#fff7ea" stroke="#315b31" stroke-width="2.3"/><circle r="5" fill="#315b31"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.55">VERDICT</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">approve / escalate</text>
    </g>
<!-- escalation branch -->
<path d="M1055 265 V326 H1245 V265" fill="none" stroke="#842f24" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="1150" y="350" fill="#842f24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.3">round-two survivors → ESCALATED</text>

<g transform="translate(64 382)">
  <rect width="1272" height="38" rx="8" fill="#fff7ea" stroke="#8a7358"/>
  <text x="18" y="24" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.2">Severe finding without persisted evidence = not a finding.</text>
</g>
</svg>