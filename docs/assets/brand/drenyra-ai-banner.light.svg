<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="1400" height="460" role="img" aria-labelledby="bannerTitle bannerDesc" font-family="'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="bannerTitle">Drenyra AI &#8212; Verifiable Accounting Agent Ecosystem</title>
  <desc id="bannerDesc">Drenyra AI, by Arkelythex. AI proposes. The system validates. The professional decides. Evidence remains. A signed receipt card shows receipt 0007 for candidate C-7F3A, materiality R2, explicit approval, an Ed25519 signature that is verified, and a sha256 hash.</desc>
