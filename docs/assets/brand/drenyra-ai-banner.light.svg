    <text x="196" y="228" font-size="11.5" fill="#725E4C">Ed25519</text>
    <line x1="40" y1="246" x2="328" y2="246" stroke="#8A7358" stroke-opacity="0.35"/>
    <text x="40" y="272" font-size="11" font-weight="700" letter-spacing="1.4" fill="#554638">HASH</text>
    <text x="40" y="296" font-size="14" font-weight="500" font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#100C07">sha256:9f2c&#8230;e41a</text>
    <text x="40" y="328" font-size="14" font-weight="700" fill="#824F16">immutable</text>
