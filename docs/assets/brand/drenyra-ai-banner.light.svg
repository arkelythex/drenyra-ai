    <text x="40" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#554638">APPROVAL</text>
    <text x="40" y="208" font-size="18" font-weight="700" fill="#57478B">explicit</text>
    <text x="40" y="228" font-size="11.5" fill="#725E4C">by the professional</text>
