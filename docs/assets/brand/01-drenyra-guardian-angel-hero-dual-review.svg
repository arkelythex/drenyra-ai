<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#100c07" flood-opacity=".13"/></filter>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r=".45" fill="#17120d" opacity=".018"/><circle cx="15" cy="14" r=".4" fill="#824f16" opacity=".018"/>
  </pattern>
</defs>
<rect width="1400" height="460" fill="#f3eadc"/>
<rect width="1400" height="460" fill="url(#grain)"/>

<text x="68" y="52" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1">ARKELYTHEX / DRENYRA</text>
<text x="68" y="112" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start" letter-spacing="0">Guardian Angel</text>
<text x="68" y="149" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start" letter-spacing="0">Independent adversarial verification for fiscal work</text>

<g transform="translate(68 205)">
  <line x1="0" y1="0" x2="570" y2="0" stroke="#8a7358" stroke-width="1"/>
  <text x="0" y="40" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Independent.</text>
  <text x="142" y="40" fill="#a7471c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Adversarial.</text>
  <text x="287" y="40" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-first.</text>
  <text x="0" y="79" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">A separate lens over frozen candidates. Never the author. Never approval.</text>
</g>

<g transform="translate(68 334)">
  <rect width="570" height="70" rx="10" fill="#fff7ea" stroke="#8a7358"/>
  <text x="20" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">TARGET</text>
  <text x="190" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">JUDGMENT</text>
  <text x="392" y="26" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">VERDICT</text>
  <circle cx="28" cy="49" r="5" fill="#0d4a68"/><circle cx="198" cy="49" r="5" fill="#57478b"/><circle cx="400" cy="49" r="5" fill="#315b31"/>
  <text x="42" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">frozen bytes</text>
  <text x="212" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">blind dual review</text>
  <text x="414" y="54" fill="#17120d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">approved / escalated</text>
</g>

<!-- dossier / twin lenses -->
<g transform="translate(845 48)" filter="url(#shadow)">
  <rect x="34" y="18" width="390" height="302" rx="16" fill="#decbb1" stroke="#8a7358" transform="rotate(2 210 170)"/>
  <rect x="0" y="0" width="390" height="316" rx="16" fill="#fff7ea" stroke="#66513b" stroke-width="1.3"/>
  <text x="28" y="40" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">FROZEN CANDIDATE / C-204</text>
  <line x1="28" y1="58" x2="362" y2="58" stroke="#8a7358"/>
  <!-- two review lenses -->
  <g transform="translate(112 142)">
    <circle r="56" fill="#e6d7c4" stroke="#0d4a68" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#0d4a68" stroke-width="1.5"/>
    <circle r="7" fill="#0d4a68"/>
    <text x="0" y="82" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.1">JUDGE A</text>
  </g>
  <g transform="translate(278 142)">
    <circle r="56" fill="#e6d7c4" stroke="#57478b" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#57478b" stroke-width="1.5"/>
    <circle r="7" fill="#57478b"/>
    <text x="0" y="82" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.1">JUDGE B</text>
  </g>
  <!-- convergence -->
  <path d="M112 198 C132 246 170 252 195 252" fill="none" stroke="#0d4a68" stroke-width="1.4"/>
  <path d="M278 198 C258 246 220 252 195 252" fill="none" stroke="#57478b" stroke-width="1.4"/>
  <circle cx="195" cy="252" r="12" fill="#f3eadc" stroke="#a7471c" stroke-width="2"/>
  <text x="195" y="288" fill="#a7471c" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">CANONICAL FINDINGS</text>
</g>

<g transform="translate(1268 92)">
  <rect width="72" height="230" rx="10" fill="#0d4a68"/>
  <text x="36" y="115" fill="#fff7ea" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(90 36 115)" letter-spacing="2">READ ONLY</text>
</g>
</svg>