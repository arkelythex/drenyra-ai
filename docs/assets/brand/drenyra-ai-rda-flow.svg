<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0%" stop-color="#3CE6D8"/><stop offset="100%" stop-color="#9B7FE8"/>
 </linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="460" rx="0" fill="#000000"/>
<text x="82" y="88" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Receipt-Driven Accounting</text>
<text x="82" y="123" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="16">proposal → candidate → risk tier → approval → receipt → verifiable ledger</text>

<!-- main spine -->
<path d="M130 266 H1260" fill="none" stroke="#2A2A2A" stroke-width="8" stroke-linecap="round"/>
<path d="M130 266 H1260" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".85" filter="url(#g)"/>


<g transform="translate(150 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">PROPOSAL</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">agent</text>
</g>
<g transform="translate(355 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">CANDIDATE</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">identity + materiality</text>
</g>
<g transform="translate(570 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">R0 · R1 · R2 · R3</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">risk-proportional review</text>
</g>
<g transform="translate(800 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">APPROVAL</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">explicit human event</text>
</g>
<g transform="translate(1010 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">RECEIPT</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">Ed25519 signed</text>
</g>
<g transform="translate(1215 266)">
 <circle r="34" fill="#0A0A0A" stroke="url(#edge)" stroke-width="2"/>
 <circle r="4" fill="#3CE6D8"/>
 <text x="0" y="-59" text-anchor="middle" fill="#F3EADC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">LEDGER</text>
 <text x="0" y="66" text-anchor="middle" fill="#5C5347" font-family="Inter,Arial,sans-serif" font-size="12">append-only hash chain</text>
</g>
<!-- gate cue -->
<g transform="translate(685 266)">
 <rect x="-18" y="-52" width="36" height="104" rx="18" fill="#121212" stroke="#9B7FE8" stroke-width="1.5"/>
 <path d="M-6 0 L0 6 L10 -8" fill="none" stroke="#3CE6D8" stroke-width="2.5" stroke-linecap="round"/>
</g>
<text x="685" y="389" text-anchor="middle" fill="#84786A" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2">GATE</text>
