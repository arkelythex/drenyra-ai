<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Drenyra AI — Verifiable Accounting Agent Ecosystem">
  <!-- brand-system v0.2: mirrors apps/web DTCG palette — dark + light themes, cyan/violet accents.
       Every color below is a token from contracts/brand-system/tokens.json; validated zero-tolerance by
       scripts/brand-conformance.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="g-bg1" offset="0%"/>
      <stop class="g-bg2" offset="55%"/>
      <stop class="g-bg3" offset="100%"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-title1" offset="0%"/>
      <stop class="g-title2" offset="100%"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop class="g-card1" offset="0%"/>
      <stop class="g-card2" offset="100%"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="var(--grid)" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    :root {
      --bg1: #000000; --bg2: #0A0A0A; --bg3: #121212;
      --grid: #FFFFFF;
      --glow-cyan: #3CE6D8; --glow-violet: #9B7FE8;
      --title1: #3CE6D8; --title2: #9B7FE8;
      --subtitle: #EDEFF2;
      --chip1: #3CE6D8; --chip2: #4ADE94; --chip3: #9B7FE8; --chip4: #6B9FE8;
      --chip-text1: #6AEFE4; --chip-text2: #4ADE94; --chip-text3: #B8A2F0; --chip-text4: #A8B0BC;
      --subline: #A8B0BC;
      --card-back: #000000; --card-back-border: #1F1F1F;
      --card-mid: #0A0A0A; --card-mid-border: #2A2A2A;
      --card-front: #121212; --card-front-stroke: #3CE6D8;
      --bar: #6B7480; --bar-top: #6AEFE4; --bar-accent: #F5B84A;
      --check: #4ADE94;
      --label: #EDEFF2; --label-sub: #A8B0BC;
    }
    .g-bg1 { stop-color: var(--bg1); }
    .g-bg2 { stop-color: var(--bg2); }
    .g-bg3 { stop-color: var(--bg3); }
    .g-title1 { stop-color: var(--title1); }
    .g-title2 { stop-color: var(--title2); }
    .g-card1 { stop-color: var(--card-mid); }
    .g-card2 { stop-color: var(--card-mid); }
    @media (prefers-color-scheme: light) {
      :root {
        --bg1: #FAFAF9; --bg2: #FFFFFF; --bg3: #F2F2F0;
        --grid: #000000;
        --glow-cyan: #2ECFC2; --glow-violet: #6B54A8;
        --title1: #2ECFC2; --title2: #6B54A8;
        --subtitle: #16181B;
        --chip1: #2ECFC2; --chip2: #1A8F52; --chip3: #6B54A8; --chip4: #2E5FB8;
        --chip-text1: #1F8A80; --chip-text2: #1A8F52; --chip-text3: #6B54A8; --chip-text4: #2E5FB8;
        --subline: #52565D;
        --card-back: #FAFAF9; --card-back-border: #E5E5E2;
        --card-mid: #FFFFFF; --card-mid-border: #D4D4D0;
        --card-front: #F2F2F0; --card-front-stroke: #2ECFC2;
        --bar: #D4D4D0; --bar-top: #2ECFC2; --bar-accent: #A86A0A;
        --check: #1A8F52;
        --label: #16181B; --label-sub: #52565D;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1400" height="460" fill="url(#bg)"/>
  <rect width="1400" height="460" fill="url(#grid)"/>

  <!-- Subtle glow accents (cyan + violet only) -->
  <circle cx="1120" cy="120" r="260" fill="var(--glow-cyan)" opacity="0.06"/>
  <circle cx="150" cy="400" r="300" fill="var(--glow-violet)" opacity="0.05"/>

  <!-- Left: title block -->
  <text x="80" y="190" font-family="'Space Grotesk', 'Inter', 'Geist', sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="url(#title)">DRENYRA AI</text>

  <text x="82" y="250" font-family="'Inter', 'Geist', sans-serif" font-size="26" font-weight="500" fill="var(--subtitle)" letter-spacing="0.5">Verifiable Accounting Agent Ecosystem</text>

  <!-- Tagline chips: cyan / success / violet / pending -->
  <g font-family="'Inter', 'Geist', sans-serif" font-size="17" font-weight="600">
    <rect x="80" y="286" width="262" height="40" rx="20" fill="var(--chip1)" opacity="0.12" stroke="var(--chip1)" stroke-opacity="0.35"/>
    <text x="100" y="312" fill="var(--chip-text1)">Receipt-Driven Accounting</text>

    <rect x="362" y="286" width="198" height="40" rx="20" fill="var(--chip2)" opacity="0.12" stroke="var(--chip2)" stroke-opacity="0.35"/>
    <text x="382" y="312" fill="var(--chip-text2)">Audit Ledger</text>

    <rect x="580" y="286" width="168" height="40" rx="20" fill="var(--chip3)" opacity="0.12" stroke="var(--chip3)" stroke-opacity="0.35"/>
    <text x="600" y="312" fill="var(--chip-text3)">Missions</text>

    <rect x="768" y="286" width="142" height="40" rx="20" fill="var(--chip4)" opacity="0.12" stroke="var(--chip4)" stroke-opacity="0.35"/>
    <text x="788" y="312" fill="var(--chip-text4)">Gates</text>
  </g>

  <!-- Subline -->
  <text x="82" y="380" font-family="'Inter', 'Geist', sans-serif" font-size="18" fill="var(--subline)">
    Every material action produces an immutable receipt. Every transition runs a gate.
  </text>
  <text x="82" y="408" font-family="'Inter', 'Geist', sans-serif" font-size="18" fill="var(--subline)">
    Agents propose. The deterministic core decides.
  </text>

  <!-- Right: receipt stack motif -->
  <g transform="translate(1030, 60)">
    <!-- Back card -->
    <g transform="rotate(-8)">
      <rect x="0" y="40" width="240" height="300" rx="14" fill="var(--card-back)" stroke="var(--card-back-border)" stroke-width="1.5"/>
      <rect x="70" y="70" width="100" height="18" rx="4" fill="var(--bar-top)" opacity="0.5"/>
      <rect x="24" y="110" width="192" height="10" rx="5" fill="var(--bar)"/>
      <rect x="24" y="132" width="160" height="10" rx="5" fill="var(--bar)"/>
      <rect x="24" y="154" width="180" height="10" rx="5" fill="var(--bar)"/>
      <rect x="24" y="176" width="120" height="10" rx="5" fill="var(--bar)"/>
    </g>
    <!-- Middle card -->
    <g transform="rotate(-2)">
      <rect x="22" y="22" width="250" height="310" rx="14" fill="url(#card)" stroke="var(--card-mid-border)" stroke-width="1.5"/>
      <rect x="95" y="50" width="105" height="18" rx="4" fill="var(--bar-top)" opacity="0.6"/>
      <rect x="44" y="90" width="206" height="10" rx="5" fill="var(--bar)" opacity="0.8"/>
      <rect x="44" y="112" width="170" height="10" rx="5" fill="var(--bar)" opacity="0.8"/>
      <rect x="44" y="134" width="192" height="10" rx="5" fill="var(--bar)" opacity="0.8"/>
      <rect x="44" y="156" width="140" height="10" rx="5" fill="var(--bar)" opacity="0.8"/>
      <rect x="44" y="240" width="120" height="10" rx="5" fill="var(--bar-accent)" opacity="0.55"/>
      <rect x="44" y="262" width="96" height="10" rx="5" fill="var(--bar-accent)" opacity="0.35"/>
    </g>
    <!-- Front card with checkmark -->
    <g>
      <rect x="44" y="4" width="260" height="320" rx="14" fill="var(--card-front)" stroke="var(--card-front-stroke)" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="122" y="30" width="105" height="18" rx="4" fill="var(--bar-top)" opacity="0.75"/>
      <rect x="66" y="72" width="216" height="10" rx="5" fill="var(--bar)" opacity="0.9"/>
      <rect x="66" y="94" width="180" height="10" rx="5" fill="var(--bar)" opacity="0.9"/>
      <rect x="66" y="116" width="202" height="10" rx="5" fill="var(--bar)" opacity="0.9"/>
      <rect x="66" y="138" width="150" height="10" rx="5" fill="var(--bar)" opacity="0.9"/>
      <circle cx="174" cy="215" r="40" fill="var(--check)" opacity="0.15" stroke="var(--check)" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M 152 215 L 168 231 L 197 199" fill="none" stroke="var(--check)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="286" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="var(--label)" letter-spacing="1">RECEIPT · Ed25519</text>
      <text x="86" y="308" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="13" fill="var(--label-sub)">verified · immutable · receipted</text>
    </g>
  </g>
</svg>
