    <svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Drenyra AI — Verifiable Accounting Agent Ecosystem">
      <!-- brand-system v0.1: colors from contracts/brand-system/tokens.json (base + derived) only -->
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0a0e27"/>
          <stop offset="55%" stop-color="#141830"/>
          <stop offset="100%" stop-color="#1e2138"/>
        </linearGradient>
        <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1a73e8"/>
          <stop offset="100%" stop-color="#5f9def"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f5a623"/>
          <stop offset="100%" stop-color="#fccc50"/>
        </linearGradient>
        <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#141830"/>
          <stop offset="100%" stop-color="#141830"/>
        </linearGradient>
        <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
      </defs>

      <!-- Background -->
      <rect width="1400" height="460" fill="url(#bg)"/>
      <rect width="1400" height="460" fill="url(#grid)"/>

      <!-- Subtle glow accents (primary + secondary only) -->
      <circle cx="1120" cy="120" r="260" fill="#1a73e8" opacity="0.06"/>
      <circle cx="150" cy="400" r="300" fill="#f5a623" opacity="0.05"/>

      <!-- Left: title block -->
      <text x="80" y="190" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="url(#title)">DRENYRA AI</text>

      <text x="82" y="250" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#e0e0e0" letter-spacing="0.5">Verifiable Accounting Agent Ecosystem</text>

      <!-- Tagline chips: primary / success / secondary / muted-foreground -->
      <g font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
        <rect x="80" y="286" width="262" height="40" rx="20" fill="#1a73e8" opacity="0.12" stroke="#1a73e8" stroke-opacity="0.35"/>
        <text x="100" y="312" fill="#5f9def">Receipt-Driven Accounting</text>

        <rect x="362" y="286" width="198" height="40" rx="20" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/>
        <text x="382" y="312" fill="#5ddcad">Audit Ledger</text>

        <rect x="580" y="286" width="168" height="40" rx="20" fill="#f5a623" opacity="0.12" stroke="#f5a623" stroke-opacity="0.35"/>
        <text x="600" y="312" fill="#f8bc5a">Missions</text>

        <rect x="768" y="286" width="142" height="40" rx="20" fill="#8892b0" opacity="0.12" stroke="#8892b0" stroke-opacity="0.35"/>
        <text x="788" y="312" fill="#a6adc4">Gates</text>
      </g>

      <!-- Subline -->
      <text x="82" y="380" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8892b0">
        Every material action produces an immutable receipt. Every transition runs a gate.
      </text>
      <text x="82" y="408" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8892b0">
        Agents propose. The deterministic core decides.
      </text>

      <!-- Right: receipt stack motif -->
      <g transform="translate(1030, 60)">
        <!-- Back card -->
        <g transform="rotate(-8)">
          <rect x="0" y="40" width="240" height="300" rx="14" fill="#0a0e27" stroke="#1e3a5f" stroke-width="1.5"/>
          <rect x="70" y="70" width="100" height="18" rx="4" fill="#5f9def" opacity="0.5"/>
          <rect x="24" y="110" width="192" height="10" rx="5" fill="#4a5568"/>
          <rect x="24" y="132" width="160" height="10" rx="5" fill="#4a5568"/>
          <rect x="24" y="154" width="180" height="10" rx="5" fill="#4a5568"/>
          <rect x="24" y="176" width="120" height="10" rx="5" fill="#4a5568"/>
        </g>
        <!-- Middle card -->
        <g transform="rotate(-2)">
          <rect x="22" y="22" width="250" height="310" rx="14" fill="url(#card)" stroke="#1e3a5f" stroke-width="1.5"/>
          <rect x="95" y="50" width="105" height="18" rx="4" fill="#5f9def" opacity="0.6"/>
          <rect x="44" y="90" width="206" height="10" rx="5" fill="#4a5568" opacity="0.7"/>
          <rect x="44" y="112" width="170" height="10" rx="5" fill="#4a5568" opacity="0.7"/>
          <rect x="44" y="134" width="192" height="10" rx="5" fill="#4a5568" opacity="0.7"/>
          <rect x="44" y="156" width="140" height="10" rx="5" fill="#4a5568" opacity="0.7"/>
          <rect x="44" y="240" width="120" height="10" rx="5" fill="#f5a623" opacity="0.55"/>
          <rect x="44" y="262" width="96" height="10" rx="5" fill="#f5a623" opacity="0.35"/>
        </g>
        <!-- Front card with checkmark -->
        <g>
          <rect x="44" y="4" width="260" height="320" rx="14" fill="#1e2138" stroke="#1a73e8" stroke-opacity="0.55" stroke-width="2"/>
          <rect x="122" y="30" width="105" height="18" rx="4" fill="#1a73e8" opacity="0.75"/>
          <rect x="66" y="72" width="216" height="10" rx="5" fill="#4a5568" opacity="0.8"/>
          <rect x="66" y="94" width="180" height="10" rx="5" fill="#4a5568" opacity="0.8"/>
          <rect x="66" y="116" width="202" height="10" rx="5" fill="#4a5568" opacity="0.8"/>
          <rect x="66" y="138" width="150" height="10" rx="5" fill="#4a5568" opacity="0.8"/>
          <circle cx="174" cy="215" r="40" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
          <path d="M 152 215 L 168 231 L 197 199" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="86" y="286" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#e0e0e0" letter-spacing="1">RECEIPT · Ed25519</text>
          <text x="86" y="308" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="13" fill="#8892b0">verified · immutable · receipted</text>
        </g>
      </g>
    </svg>
