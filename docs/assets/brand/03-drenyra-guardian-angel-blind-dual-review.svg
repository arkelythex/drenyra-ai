<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<rect width="1400" height="460" fill="#f3eadc"/>
<text x="64" y="50" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.0">INDEPENDENT REVIEW</text>
<text x="64" y="96" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Two blind judges. One frozen target.</text>
<text x="64" y="128" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Agreement corroborates. Contradiction escalates. Neither reviewer sees the other's work.</text>

<!-- target -->
<g transform="translate(64 182)">
  <rect width="300" height="188" rx="14" fill="#fff7ea" stroke="#66513b"/>
  <text x="24" y="34" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">FROZEN TARGET</text>
  <text x="24" y="76" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Candidate C-204</text>
  <text x="24" y="112" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">content-derived identity</text>
  <text x="24" y="138" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">scope + materiality frozen</text>
  <text x="24" y="164" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">read-only</text>
</g>

<!-- Judge A -->
<g transform="translate(504 174)">
  <rect width="260" height="92" rx="12" fill="#fff7ea" stroke="#0d4a68"/>
  <text x="20" y="30" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">JUDGE A</text>
  <text x="20" y="60" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">neutral findings</text>
</g>
<!-- Judge B -->
<g transform="translate(504 286)">
  <rect width="260" height="92" rx="12" fill="#fff7ea" stroke="#57478b"/>
  <text x="20" y="30" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2">JUDGE B</text>
  <text x="20" y="60" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">neutral findings</text>
</g>

<!-- canonical set -->
<g transform="translate(930 182)">
  <rect width="406" height="188" rx="14" fill="#decbb1" stroke="#66513b"/>
  <text x="24" y="34" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">CANONICAL FINDINGS</text>
  <text x="24" y="74" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Corroborated</text>
  <text x="24" y="104" fill="#a7471c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Contradicted</text>
  <text x="24" y="134" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Pre-existing</text>
  <text x="24" y="162" fill="#842f24" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Candidate-caused severe</text>
</g>

<!-- connectors -->
<path d="M364 276 H440 V220 H504" fill="none" stroke="#0d4a68" stroke-width="1.5"/>
<path d="M364 276 H440 V332 H504" fill="none" stroke="#57478b" stroke-width="1.5"/>
<path d="M764 220 H844 V276 H930" fill="none" stroke="#0d4a68" stroke-width="1.5"/>
<path d="M764 332 H844 V276 H930" fill="none" stroke="#57478b" stroke-width="1.5"/>
<circle cx="844" cy="276" r="7" fill="#f3eadc" stroke="#a7471c" stroke-width="2"/>
</svg>