<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
  <radialGradient id="bg1" cx="76%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#3CE6D8" stop-opacity=".12"/>
    <stop offset="36%" stop-color="#9B7FE8" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#121212"/>
    <stop offset="45%" stop-color="#0A0A0A"/>
    <stop offset="100%" stop-color="#121212"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3CE6D8"/>
    <stop offset="52%" stop-color="#9B7FE8"/>
    <stop offset="100%" stop-color="#3CE6D8"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="7" r=".5" fill="#EDEFF2" opacity=".035"/>
    <circle cx="17" cy="4" r=".45" fill="#EDEFF2" opacity=".026"/>
    <circle cx="12" cy="19" r=".5" fill="#EDEFF2" opacity=".022"/>
  </pattern>
</defs>
<rect width="1400" height="460" fill="#000000"/>
<rect width="1400" height="460" fill="url(#bg1)"/>
<ellipse cx="1060" cy="245" rx="310" ry="120" fill="#3CE6D8" opacity=".035" filter="url(#soft)"/>
<rect width="1400" height="460" fill="url(#grain)"/>

