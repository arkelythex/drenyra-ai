  <text x="720" y="562" font-size="11.5" fill="#725E4C">Irreversible operations require explicit dual approval.</text>
<line x1="40" y1="638" x2="1200" y2="638" stroke="#8A7358" stroke-opacity="0.35"/>
  <text x="620" y="658" font-size="12" text-anchor="middle" fill="#725E4C">One scoped correction per candidate. Different bytes require re-inspection.</text>
