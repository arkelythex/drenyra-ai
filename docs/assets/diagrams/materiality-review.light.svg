<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="materiality-reviewTitle materiality-reviewDesc" font-family="'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="materiality-reviewTitle">Review &#8212; proportional, never optional by claim</title>
  <desc id="materiality-reviewDesc">The tier comes from the candidate, not the confidence of the agent. Value, reversibility, jurisdiction. Money is BigInt cents; policy rules run in a fixed order. Unknown jurisdiction escalates. Increase one tier; R3 remains the ceiling. Controlled autonomy. Read-only queries and non-material drafts. Focused review. Standard entries remain subject to the applicable gates. One explicit approval. Review and approval are recorded, never inferred. Two distinct approvers. Irreversible operations require explicit dual approval.</desc>
  <defs>
    <radialGradient id="materiality-reviewAmbient" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#824F16" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#824F16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1240" height="680" rx="24" fill="#F3EADC"/>
  <rect width="1240" height="680" rx="24" fill="url(#materiality-reviewAmbient)"/>
