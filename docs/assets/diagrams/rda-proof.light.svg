<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="rda-proofTitle rda-proofDesc" font-family="'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="rda-proofTitle">RDA &#8212; a proposal is not proof</title>
  <desc id="rda-proofDesc">Bind the work to exact bytes, explicit decisions, and signed evidence. Stage the work. A proposal never claims ERP, bank, or SUNAT execution. Identify the exact subject. Content-derived identity binds the reviewed bytes and scope. Derive the review depth. BigInt cents, reversibility, and jurisdiction determine R0&#8211;R3. Check the required approval. R2 needs one approver; R3 needs two distinct approvers. Verify the signed result. Hash, Ed25519 signature, and trusted signer must agree. Keep the evidence chain. Append-only records expose the first integrity divergence.</desc>
  <defs>
    <radialGradient id="rda-proofAmbient" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#824F16" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#824F16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1240" height="680" rx="24" fill="#F3EADC"/>
  <rect width="1240" height="680" rx="24" fill="url(#rda-proofAmbient)"/>
<text x="40" y="58" font-size="27" font-weight="700" fill="#100C07">RDA &#8212; a proposal is not proof</text>
  <text x="41" y="88" font-size="14.5" fill="#725E4C">Bind the work to exact bytes, explicit decisions, and signed evidence.</text>
