  <text x="720" y="517" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#315B31" opacity="0.85">AUDIT LEDGER</text>
  <text x="720" y="542" font-size="17" font-weight="600" fill="#100C07">Keep the evidence chain</text>
  <text x="720" y="562" font-size="11.5" fill="#725E4C">Append-only records expose the first integrity divergence.</text>
<line x1="40" y1="638" x2="1200" y2="638" stroke="#8A7358" stroke-opacity="0.35"/>
  <text x="620" y="658" font-size="12" text-anchor="middle" fill="#725E4C">Agents propose. Professionals decide. Evidence remains.</text>
