  <line x1="200" y1="486" x2="200" y2="576" stroke="#8A7358" stroke-opacity="0.35"/>
<rect x="224" y="487" width="452" height="90" rx="14" fill="#100C07" fill-opacity="0.1"/>
  <rect x="224" y="484" width="452" height="90" rx="14" fill="#FFF7EA" stroke="#315B31" stroke-opacity="0.55"/>
  <rect x="224" y="484" width="452" height="90" rx="14" fill="#315B31" fill-opacity="0.07"/>
  <text x="244" y="517" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#315B31" opacity="0.85">RECEIPT</text>
