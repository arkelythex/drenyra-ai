<rect x="700" y="487" width="452" height="90" rx="14" fill="#100C07" fill-opacity="0.1"/>
  <rect x="700" y="484" width="452" height="90" rx="14" fill="#FFF7EA" stroke="#315B31" stroke-opacity="0.55"/>
