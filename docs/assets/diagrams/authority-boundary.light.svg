<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="authority-boundaryTitle authority-boundaryDesc" font-family="'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="authority-boundaryTitle">Authority &#8212; context is not permission</title>
  <desc id="authority-boundaryDesc">Keep advice, deterministic enforcement, and professional decisions separate. Propose and stage. Domain knowledge guides work; it cannot approve itself. Remember the context. Institutional memory informs; it never authorizes. Carry the exact scope. RUC, company, and fiscal period isolate every operation. Validate policy and evidence. Gates fail closed when required authority is missing. Retain fiscal authority. Business and legal judgment stays with the human. Require external evidence. ERP, bank, and SUNAT effects are not proved by a narrative.</desc>
