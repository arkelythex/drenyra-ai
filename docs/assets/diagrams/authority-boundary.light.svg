    <radialGradient id="authority-boundaryAmbient" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#824F16" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#824F16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1240" height="680" rx="24" fill="#F3EADC"/>
  <rect width="1240" height="680" rx="24" fill="url(#authority-boundaryAmbient)"/>
