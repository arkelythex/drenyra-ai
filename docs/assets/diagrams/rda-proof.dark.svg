  <text x="68" y="565" font-size="13" font-weight="700" letter-spacing="2" fill="#C7C7C7">PROVE</text>
  <line x1="200" y1="486" x2="200" y2="576" stroke="#6B6B6B" stroke-opacity="0.4"/>
<rect x="224" y="487" width="452" height="90" rx="14" fill="#000000" fill-opacity="0.5"/>
  <rect x="224" y="484" width="452" height="90" rx="14" fill="#1F1F1F" stroke="#34D399" stroke-opacity="0.55"/>
