  <text x="720" y="517" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#34D399" opacity="0.85">AUDIT LEDGER</text>
  <text x="720" y="542" font-size="17" font-weight="600" fill="#F5F5F5">Keep the evidence chain</text>
  <text x="720" y="562" font-size="11.5" fill="#A7A7A7">Append-only records expose the first integrity divergence.</text>
<line x1="40" y1="638" x2="1200" y2="638" stroke="#6B6B6B" stroke-opacity="0.4"/>
  <text x="620" y="658" font-size="12" text-anchor="middle" fill="#A7A7A7">Agents propose. Professionals decide. Evidence remains.</text>
