  <text x="68" y="233" font-size="13" font-weight="700" letter-spacing="2" fill="#C7C7C7">PROPOSE</text>
  <line x1="200" y1="154" x2="200" y2="244" stroke="#6B6B6B" stroke-opacity="0.4"/>
<rect x="224" y="155" width="452" height="90" rx="14" fill="#000000" fill-opacity="0.5"/>
