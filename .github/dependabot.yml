# Fiscal convention: monetary values in the Drenyra ecosystem are BigInt cents; no float is ever used for money; version/sequence numbers are JSON integers, never floats.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The build and CI use bun (`bun install --frozen-lockfile`), so version updates must
  # edit `bun.lock`. With `npm`, every dependency pull request failed at the install step
  # with "lockfile had changes, but lockfile is frozen", because the update touched only
  # `package-lock.json`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: development

# `package-lock.json` is retained deliberately even though nothing builds with npm: GitHub's
# dependency graph does not support bun, so that file is the only source of Dependabot
# security alerts for this repository. It is generated from `bun.lock`, so it lists exactly
# the versions CI installs; CI fails when it is stale. After any dependency change, including
# a Dependabot pull request, refresh it with:
#   bun run deps:mirror
# Do not use `npm install --package-lock-only`: it resolves its own tree, which drifts from
# bun's and hides advisories on the versions actually installed.
