name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_from_main:
        description: "Acknowledge that dispatch publishes the current main state with Sigstore provenance"
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for npm provenance: the publish step exchanges the OIDC token for
    # a Sigstore attestation binding the published artifact to this workflow and
    # commit. Consumers verify with `npm audit signatures` after installing.
    permissions:
      contents: read
      id-token: write
    # Tag pushes publish the tagged version; manual dispatch is only allowed
    # from main with an explicit confirmation input — never from an arbitrary
    # branch state.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.event.inputs.publish_from_main == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
          # Hermetic release build: never restore the bun executable
          # from the actions cache (cache-poisoning vector in a
          # provenance-bearing publish workflow; zizmor cache-poisoning).
          no-cache: true
      # False positive at this pin: setup-node v4 caches only when the
      # `cache` input names a package manager (verified against the
      # pinned action.yml); explicit `cache: ""` declares no caching.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # Explicit no-cache: setup-node v4 caches only when the
          # `cache` input names a package manager; declare intent so
          # the publish path never consumes a poisoned dependency cache.
          cache: ""
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles
      # npm 10, which cannot exchange the OIDC token (the v0.5.0 runs failed
      # with ENEEDAUTH, then E404 on PUT). Pinned exactly for a hermetic publish.
      - name: Pin npm for trusted publishing
        # zizmor: ignore[adhoc-packages] — intentional: the npm CLI itself, pinned
        # to an exact version, is the publisher; no project dependency is added.
        run: |
          npm install -g npm@11.21.1
          npm --version
      - run: bun install --frozen-lockfile
      # Trusted Publishing (OIDC): npm exchanges the runner's identity token
      # for a short-lived publish credential bound to this exact workflow run —
      # no long-lived NPM_TOKEN secret. Configure the trusted publisher once on
      # the npm package page (GitHub Actions -> arkelythex/drenyra-ai/release.yml
      # -> allowed action npm publish). `--provenance` stays explicit: the
      # Sigstore attestation is generated automatically under trusted publishing.
      - name: Publish with Sigstore provenance
        run: npm publish --provenance
      # The registry accepts the publish before the version is readable ("Your
      # package is being processed and may take a few minutes"). v0.6.0's run
      # queried 0.5 s after publish and failed although the publish succeeded,
      # so poll with a bound instead of a single read.
      - name: Confirm published artifact
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            TARBALL="$(npm view "drenyra-ai@${VERSION}" dist.tarball 2>/dev/null || true)"
            if [ -n "$TARBALL" ]; then
              echo "published tarball: ${TARBALL} (attempt ${attempt})"
              exit 0
            fi
            sleep 15
          done
          echo "drenyra-ai@${VERSION} is not readable on the registry after 10 minutes" >&2
          exit 1
      # Exercise the consumer-side provenance check the README documents:
      # install the just-published artifact and verify its Sigstore signature.
      # `npm audit signatures` fails when any installed package lacks a valid
      # provenance attestation.
      - name: Verify published provenance signature
        # zizmor: ignore[adhoc-packages] — intentional: installs the artifact just
        # published with provenance in this same workflow (version from package.json,
        # ephemeral temp dir, --ignore-scripts) solely so `npm audit signatures`
        # can verify its Sigstore attestation.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TMP="$(mktemp -d)"
          cd "${TMP}"
          npm init -y > /dev/null 2>&1
          npm install "drenyra-ai@${VERSION}" --ignore-scripts --no-audit --no-fund > /dev/null 2>&1
          npm audit signatures

  # Attach the GitHub Release consumers verify against (Drenyra Shell's
  # runtime-dependency contract downloads the tarball from here). Built from
  # the tarball npm now serves for the tag, so the Release, its checksums.txt,
  # and the registry artifact are the same bytes. Tag pushes only: a manual
  # dispatch publishes main and has no tag to attach a Release to.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: ""
      - name: Build release assets from the npm-served tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          awk -v h="## [${VERSION}]" 'index($0, h) == 1 {f=1; print; next} f && /^## \[/ {exit} f' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test "$(wc -l < "${RUNNER_TEMP}/notes.md")" -gt 1
          OUT="${RUNNER_TEMP}/assets"
          mkdir -p "${OUT}/extract"
          cd "${OUT}"
          npm pack "drenyra-ai@${VERSION}" --silent > /dev/null
          TGZ="drenyra-ai-${VERSION}.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "${TGZ}" | base64 -w0)" = "$(npm view "drenyra-ai@${VERSION}" dist.integrity)"
          tar -xzf "${TGZ}" -C extract
          cp extract/package/dist/sbom.json sbom.json
          (cd extract/package/dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort | xargs -d '\n' sha256sum) > checksums.txt
          sha256sum "${TGZ}" sbom.json >> checksums.txt
          if find extract/package/dist -name '*.tgz' | grep -q .; then
            echo "a tarball is nested inside dist/ — refusing to release" >&2
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "${RUNNER_TEMP}/assets"
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --verify-tag \
            --title "drenyra-ai ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" \
            "drenyra-ai-${VERSION}.tgz" sbom.json checksums.txt
