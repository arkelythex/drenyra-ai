name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run test

  brand-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      # Pins contracts/brand-system.md: derivation byte-exact, banner SVG
      # zero-tolerance, raster coverage. Fails on any brand drift.
      - run: bun run brand:conformance

  skills-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The authoring manifest lives in the drenyra-skills repo; check it out
      # inside the workspace and point the gate at it explicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arkelythex/drenyra-skills
          path: drenyra-skills
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      # Pins drenyra-skills/skills/registry.json (authoring source) to the
      # shipped BASE_PE_SKILLS. Fails on any registry drift.
      - run: bun run skills:conformance -- --manifest drenyra-skills/skills/registry.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # Build dist, run the full suite, verify the packaged file manifest.
      - name: Verify package and release-integrity evidence
        run: bun run verify:package
      # Prove the PUBLISHED artifact works: npm pack -> install .tgz -> run
      # the bin under plain Node and resolve the library entry.
      - run: node scripts/verify-packed-install.mjs
