schema: spec-driven

context: |
  Stack: TypeScript 7.0 ESM (Node >= 22), Bun package manager (bun.lock, CI uses bun, bun 1.3), Vitest 4.1.
  Architecture: Drenyra AI compatibility is defined by frozen, transport-independent fiscal contracts under contracts/**, conformance evidence, and deterministic observable behavior—not TypeScript module layout or broad JavaScript export shape. The target is a deterministic native Go executable with a transport-independent fiscal core and explicit adapters. Contracts govern implementation; canonicalization remains shallow/top-level; exact bytes govern serialization, hashing, candidate identity, and receipts. Fiscal authority preserves exact integer cents, complete bound scope, receipt-before-material-action, fail-closed gates/approvals, and append-only audit evidence. TS 0.5.0 is a temporary oracle and compatibility surface only; production Go may not import or execute it or use PATH/global/ambient discovery. Existing testing/apply/verify commands are legacy TS-oracle commands; native Go verification remains unavailable until an approved Go-bearing work unit establishes it. Drenyra AI remains independent of Pi; exact verified package-local Pi consumption belongs only to GO-090.
  Target 16-program Peru v1 roadmap adds modules tenant/, evidence/, ingest/, policy/, and journal/ over
  phased slices; ledger/ remains audit-only. SUNAT-facing capabilities are in scope per slice.
  Testing: Vitest 4.1 — 647 tests across 52 files (3 pre-existing failures in cmd/__tests__/cli.test.ts as of this init; app code untouched); frozen conformance vectors under contracts/__tests__;
  packed-artifact and install verification via scripts.
  Style: strict TS (no any, const-object types, flat interfaces); commands/output/adapters separated;
  money as BigInt cents; version/sequence numbers as JSON integers; fail-closed gates; English artifacts.

session:
  execution_mode: automatic
  delivery_strategy: auto-chain
  review_budget_lines: 300

strict_tdd: true

testing:
  runner: vitest
  test_command: bun run test
  typecheck_command: bun run typecheck
  build_command: bun run build
  coverage:
    available: false
    command: ""
  layers:
    unit: true
    integration: true
    e2e: false
  quality:
    linter: none
    typechecker: tsc --noEmit (strict, wired in tsconfig.json)
    formatter: none

rules:
  proposal:
    - Map each change to the 16-program Peru v1 roadmap and to an approved architecture section (AI advisory vs deterministic authority; audit ledger vs accounting journal; evidence vs memory)
    - State the current-state gap, first-slice scope, non-goals, and product tradeoffs
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep contract language transport-agnostic. Approved target (16-program Peru v1) adds tenant, evidence, journal, policy, and ingest capabilities plus SUNAT-facing flows over phased slices; integrations are deferred unless explicitly scoped in the change — they are not permanently prohibited
  design:
    - Treat frozen contracts and deterministic observable behavior as the language-independent surface; target a native Go fiscal core with explicit adapters and use TS 0.5.0 only as a temporary oracle
    - Preserve shallow exact bytes, integer cents, complete bound scope, receipt-before-material-action, fail-closed gates and approvals, and append-only audit evidence
    - Keep harnesses and adapters non-authoritative; prohibit production TS/Node and ambient executable discovery; document explicit dependencies, evidence, and rollback
  tasks:
    - Group by phase with hierarchical numbering; keep tasks completable in one session
    - Stay inside the 300 changed-line review budget; forecast when chained PRs may be needed
  apply:
    tdd: true
    test_command: bun run test
  verify:
    test_command: bun run test
    build_command: bun run build
    typecheck_command: bun run typecheck
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas; archived changes are an audit trail and are never modified
